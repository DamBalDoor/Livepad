name: Deploy DEV (develop)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/dambaldoor/livepad

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          export IMAGE_TAG
          docker compose -f docker-compose.dev.yml build api web runner
          docker compose -f docker-compose.dev.yml --profile migrate build migrate
          docker compose -f docker-compose.dev.yml push api web runner
          docker compose -f docker-compose.dev.yml --profile migrate push migrate
          for svc in api web runner migrate; do
            docker tag "${IMAGE_PREFIX}-${svc}:${IMAGE_TAG}" "${IMAGE_PREFIX}-${svc}:develop"
            docker push "${IMAGE_PREFIX}-${svc}:develop"
          done

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.DEV_GHCR_TOKEN }}
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_SSH_PORT || 22 }}
          script_stop: true
          envs: IMAGE_TAG,GHCR_TOKEN
          script: |
            set -euo pipefail
            export DEPLOY_DIR="/opt/livepad"
            export HEALTH_URL="http://127.0.0.1/api/health"
            bash "$DEPLOY_DIR/scripts/deploy-dev.sh"
